; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = xiao_nrf54lm20a

; Seeed Studio XIAO nRF54LM20A Sense via the nrf54-arduino-core platform.
; "xiao_nrf54lm20b" is the historical board ID that selects the LM20A
; hardware and memory layout (see the core's README).
[env:xiao_nrf54lm20a]
platform = https://github.com/lolren/nrf54-arduino-core.git#v1.0.23
board = xiao_nrf54lm20b
framework = arduino
upload_protocol = pyocd
monitor_speed = 115200

[env:wemos_d1_mini32]
platform = espressif32
board = wemos_d1_mini32
framework = arduino
lib_deps = fastled/FastLED@^3.10.8
monitor_speed = 115200
